<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Orders - Boitoi BookShop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<nav class="bg-gray-900 text-white p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Boitoi BookShop</h1>

    <div class="flex items-center gap-5">
        <span class="font-semibold">Admin Panel</span>

        <a href="admin-inventory.html" class="hover:text-blue-400">Inventory</a>

        <a href="index.html" class="hover:text-blue-400">Home</a>

        <button id="logoutBtn" class="hover:text-red-400">Logout</button>
    </div>
</nav>

<main class="p-8">

    <h2 class="text-4xl font-bold text-gray-800 mb-2">Admin Orders</h2>
    <p class="text-gray-600 mb-8">View all customer orders and update their status.</p>

    <section id="ordersSection">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold">All Orders</h3>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-3">Order ID</th>
                            <th class="p-3">Customer</th>
                            <th class="p-3">Date</th>
                            <th class="p-3">Total</th>
                            <th class="p-3">Payment</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Orders will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div id="orderDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold">Order Details</h3>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="orderDetailContent">
                <!-- Order detail will be loaded here -->
            </div>
        </div>
    </div>

</main>

<script src="js/admin-orders.js"></script>

</body>
</html>
