<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boitoi BookShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center flex-wrap gap-3">

        <h1 class="text-2xl font-bold">Boitoi BookShop</h1>

        <!-- Search Bar -->
        <div class="flex items-center gap-2">
            <input id="searchInput" type="text" placeholder="Search books..." class="p-2 rounded text-black w-64" />
            <button id="searchBtn" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">
                Search
            </button>
        </div>

        <!-- Menu -->
        <div class="flex items-center gap-4 flex-wrap">
            <a href="index.html" class="hover:text-blue-400">Home</a>

            <a href="#" onclick="fetchAndDisplay('categories'); return false;"
                class="hover:text-blue-400">Categories</a>

            <a href="#" onclick="fetchAndDisplay('authors'); return false;" class="hover:text-blue-400">Authors</a>

            <a href="#" onclick="fetchAndDisplay('publishers'); return false;"
                class="hover:text-blue-400">Publishers</a>

            <a id="userName" href="#" class="font-bold hover:text-blue-400"></a>
            <a id="loginLink" href="login.html" class="hover:text-blue-400">Login</a>

            <a id="registerLink" href="register.html" class="hover:text-blue-400">Register</a>

            <button id="logoutBtn" class="hover:text-blue-400 hidden">Logout</button>

            <a id="cartLink" href="cart.html" class="hover:text-blue-400">
                Cart 🛒
                <span id="cartCount" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="bg-gray-100 p-10 text-center">
        <h2 class="text-4xl font-bold mb-4">Welcome to Boitoi BookShop</h2>
        <p class="text-lg mb-6">Find your favorite books at the best price</p>
        <button class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700"
            onclick="document.getElementById('booksSection').scrollIntoView({behavior:'smooth'})">
            Explore Books
        </button>
    </section>

    <!-- Books / Catalog Section -->
    <section id="booksSection" class="p-10">
        <h2 class="text-3xl font-bold mb-6 text-center">Popular Books</h2>
        <div id="bookContainer"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
        </div>
    </section>

    <script src="js/cart.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
