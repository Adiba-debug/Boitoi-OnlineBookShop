<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Management - Boitoi BookShop</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            Boitoi BookShop
        </h1>

        <div class="flex items-center gap-4">

            <span id="adminName"></span>

            <button
                id="logoutBtn"
                class="bg-red-600 px-4 py-2 rounded hover:bg-red-700"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="max-w-6xl mx-auto p-6">

        <div class="flex justify-between items-center mb-6">

            <div>
                <h2 class="text-3xl font-bold">
                    Admin Management
                </h2>

                <p class="text-gray-600 mt-1">
                    Add or remove administrators
                </p>
            </div>

            <button
                id="addAdminBtn"
                class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700"
            >
                + Add Admin
            </button>

        </div>


        <!-- Admin List -->
        <div class="bg-white rounded-lg shadow overflow-hidden">

            <table class="w-full">

                <thead class="bg-gray-200">

                    <tr>
                        <th class="p-3 text-left">ID</th>
                        <th class="p-3 text-left">Name</th>
                        <th class="p-3 text-left">Email</th>
                        <th class="p-3 text-left">Role</th>
                        <th class="p-3 text-left">Actions</th>
                    </tr>

                </thead>

                <tbody id="adminTableBody">

                    <!-- Admins will load here -->

                </tbody>

            </table>

        </div>

    </div>


    <!-- Add Admin Modal -->
    <div
        id="addAdminModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >

        <div class="bg-white rounded-lg p-6 w-full max-w-md">

            <h3 class="text-2xl font-bold mb-4">
                Add New Admin
            </h3>


            <form id="addAdminForm">

                <div class="mb-4">

                    <label class="block mb-1 font-medium">
                        Name
                    </label>

                    <input
                        type="text"
                        id="adminNameInput"
                        class="w-full border rounded px-3 py-2"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="block mb-1 font-medium">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmailInput"
                        class="w-full border rounded px-3 py-2"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="block mb-1 font-medium">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPasswordInput"
                        class="w-full border rounded px-3 py-2"
                        required
                    >

                </div>


                <div class="flex justify-end gap-3">

                    <button
                        type="button"
                        id="cancelAdminBtn"
                        class="bg-gray-500 text-white px-4 py-2 rounded"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded"
                    >
                        Add Admin
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="js/admin-management.js"></script>

</body>

</html>
