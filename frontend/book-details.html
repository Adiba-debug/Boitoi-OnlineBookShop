<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details - Boitoi BookShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center flex-wrap gap-3">
        <h1 class="text-2xl font-bold">
            <a href="index.html">Boitoi BookShop</a>
        </h1>

        <div class="flex items-center gap-2">
            <input id="searchInput" type="text" placeholder="Search books..."
                class="p-2 rounded text-black w-56" />
            <button id="searchBtn" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Search</button>
        </div>

        <div class="flex items-center gap-4 flex-wrap">
            <a href="index.html" class="hover:text-blue-400">Home</a>
            <a id="userName" href="user-details.html" class="font-bold hover:text-blue-400"></a>
            <a id="loginLink" href="login.html" class="hover:text-blue-400">Login</a>
            <a id="registerLink" href="register.html" class="hover:text-blue-400">Register</a>
            <button id="logoutBtn" class="hover:text-blue-400 hidden">Logout</button>
            <a href="cart.html" class="hover:text-blue-400">
                Cart 🛒
                <span id="cartCount" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="px-10 pt-6 text-sm text-gray-500 flex items-center gap-2">
        <a href="index.html" class="hover:text-blue-600">Home</a>
        <span>/</span>
        <button onclick="history.back()" class="hover:text-blue-600">Back</button>
        <span>/</span>
        <span id="breadcrumbTitle" class="text-gray-800 font-semibold"></span>
    </div>

    <!-- Back Button -->
    <div class="px-10 pt-3">
        <button onclick="history.back()"
            class="text-blue-600 hover:underline text-sm flex items-center gap-1">
            ← Back
        </button>
    </div>

    <!-- Book Details -->
    <section class="p-10">
        <div id="bookDetails"
            class="max-w-5xl mx-auto bg-white rounded-lg shadow-lg p-8 min-h-[400px]">
            <p class="text-center text-gray-500">Loading book details...</p>
        </div>
    </section>

    <!-- Reviews Section -->
    <section class="px-10 pb-10">
        <div class="max-w-5xl mx-auto">

            <!-- Average Rating Summary -->
            <div id="reviewSummary" class="bg-white rounded-lg shadow p-6 mb-4">
                <p class="text-gray-400 text-sm">Loading ratings...</p>
            </div>

            <!-- Review Form -->
            <div class="bg-white rounded-lg shadow p-6 mb-4">
                <div id="reviewFormArea">
                    <p class="text-gray-400 text-sm">Loading review form...</p>
                </div>
            </div>

            <!-- Review List -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-bold mb-4">Customer Reviews</h3>
                <div id="reviewList">
                    <p class="text-gray-400 text-sm">Loading reviews...</p>
                </div>
            </div>

        </div>
    </section>

    <script src="js/cart.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/book-details.js"></script>
    <script>
        // Auth UI
        (function () {
            const user = JSON.parse(localStorage.getItem("user"));
            const userName = document.getElementById("userName");
            const loginLink = document.getElementById("loginLink");
            const registerLink = document.getElementById("registerLink");
            const logoutBtn = document.getElementById("logoutBtn");

            if (user) {
                if (userName) userName.textContent = "Hi, " + user.name;
                if (loginLink) loginLink.style.display = "none";
                if (registerLink) registerLink.style.display = "none";
                if (logoutBtn) logoutBtn.classList.remove("hidden");
            } else {
                if (loginLink) loginLink.style.display = "inline";
                if (registerLink) registerLink.style.display = "inline";
            }

            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    localStorage.removeItem("user");
                    localStorage.removeItem("token");
                    alert("Logged out successfully!");
                    window.location.href = "index.html";
                });
            }

            // Search
            const searchBtn = document.getElementById("searchBtn");
            const searchInput = document.getElementById("searchInput");
            if (searchBtn && searchInput) {
                searchBtn.addEventListener("click", function () {
                    const term = searchInput.value.trim();
                    if (term) window.location.href = `catalog.html?q=${encodeURIComponent(term)}`;
                });
                searchInput.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") searchBtn.click();
                });
            }
        })();
    </script>
</body>
</html>
