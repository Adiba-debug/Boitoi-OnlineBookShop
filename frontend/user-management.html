<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management - Boitoi BookShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


    <!-- Navbar -->

    <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            Boitoi BookShop
        </h1>

        <div class="flex items-center gap-4">

            <a href="admin-dashboard.html" class="hover:text-blue-400">
                Dashboard
            </a>

            <span id="adminName" class="font-semibold">
                Superadmin
            </span>

            <button
                id="logoutBtn"
                class="bg-red-600 px-4 py-2 rounded hover:bg-red-700"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="max-w-6xl mx-auto p-6">

        <div class="mb-6">

            <h2 class="text-3xl font-bold">
                User Management
            </h2>

            <p class="text-gray-600 mt-1">
                View, block and unblock customers.
            </p>

        </div>


        <!-- User List -->

        <div class="bg-white rounded-lg shadow overflow-hidden">

            <table class="w-full">

                <thead class="bg-gray-200">

                    <tr>

                        <th class="p-3 text-left">
                            ID
                        </th>

                        <th class="p-3 text-left">
                            Name
                        </th>

                        <th class="p-3 text-left">
                            Email
                        </th>

                        <th class="p-3 text-left">
                            Phone
                        </th>

                        <th class="p-3 text-left">
                            Status
                        </th>

                        <th class="p-3 text-left">
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="userTableBody">

                    <!-- Users will load here -->

                </tbody>

            </table>

        </div>

    </main>


    <script src="js/user-management.js"></script>

</body>

</html>
