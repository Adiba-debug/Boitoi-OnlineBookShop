<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Boitoi BookShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


    <div class="flex justify-center items-center h-screen">


        <div class="bg-white p-14 rounded-lg shadow-md w-[600px]">


            <h2 class="text-5xl font-bold text-center mb-8">
                Create Account
            </h2>


            <form id="registerForm">


                <label class="text-2xl block mb-4">
                    Name
                </label>

                <input id="name" type="text" placeholder="Enter your name"
                    class="border p-2 w-full rounded mb-6 placeholder:text-1xl">



                <label class="text-2xl block mb-4">
                    Email
                </label>

                <input id="email" type="email" placeholder="Enter email"
                    class="border p-4 w-full rounded mb-6 placeholder:text-1xl">

                <label class="text-2xl block mb-4">
                    Phone Number
                </label>

                <input id="phone_number" type="tel" placeholder="Enter your phone number"
                    class="border p-4 w-full rounded mb-6 placeholder:text-1xl">
                
                <label class="text-2xl block mb-4">
                    Password
                </label>

                <input id="password" type="password" placeholder="Create password"
                    class="border p-4 w-full rounded mb-6 placeholder:text-1xl">



                <button type="submit" class="bg-blue-600 text-white w-full py-5 rounded text-2xl">
                    Register
                </button>


            </form>


        </div>


    </div>

    <script src="js/script.js"></script>

</body>

</html>
