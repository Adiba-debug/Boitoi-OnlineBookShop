<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Boitoi BookShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


    <div class="flex justify-center items-center h-screen">


        <div class="bg-white p-8 rounded-lg shadow-md w-96">


            <h2 class="text-3xl font-bold text-center mb-6">
                Create Account
            </h2>


            <form id="registerForm">


                <label class="block mb-2">
                    Name
                </label>

                <input id="name" type="text" placeholder="Enter your name" class="border p-2 w-full rounded mb-4">



                <label class="block mb-2">
                    Email
                </label>

                <input id="email" type="email" placeholder="Enter email" class="border p-2 w-full rounded mb-4">



                <label class="block mb-2">
                    Password
                </label>

                <input id="password" type="password" placeholder="Create password"
                    class="border p-2 w-full rounded mb-6">



                <button type="submit" class="bg-blue-600 text-white w-full py-2 rounded">
                    Register
                </button>


            </form>


        </div>


    </div>

    <script src="js/script.js"></script>

</body>

</html>
