<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Boitoi BookShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


    <div class="flex justify-center items-center h-screen">


        <div class="bg-white p-14 rounded-lg shadow-md w-[600px]">


            <h2 class="text-5xl font-bold text-center mb-8">
                Login
            </h2>


            <form id="loginForm">


                <label class="text-2xl block mb-4">
                    Email
                </label>

                <input id="loginEmail" type="email" placeholder="Enter email"
                    class="border p-4 w-full rounded mb-6 placeholder:text-1.5xl" required>



                <label class="text-2xl block mb-4">
                    Password
                </label>

                <input id="loginPassword" type="password" placeholder="Enter password"
                    class="border p-4 w-full rounded mb-6 placeholder:text-1xl" required>



                <button class="bg-blue-600 text-white w-full py-5 rounded text-2xl">
                    Login
                </button>


            </form>


        </div>


    </div>

    <script src="js/script.js"></script>
</body>

</html>
